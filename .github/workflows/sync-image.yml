name: Sync Docker Image to Tencent Cloud

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 0 * * *' # 每天凌晨0点触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Tencent Cloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_CLOUD_USERNAME }}
          password: ${{ secrets.TENCENT_CLOUD_PASSWORD }}

      - name: Pull and push image
        run: |
          IMAGE_NAME="mediapipe"
          TAG="l4t35.4.1-py3.8.10-ocv4.8.0-mp0.10.7"
          NAMESPACE="my-namespace"
          docker pull ghcr.io/lanzani/${IMAGE_NAME}:${TAG}
          docker tag ghcr.io/lanzani/${IMAGE_NAME}:${TAG} ccr.ccs.tencentyun.com/${NAMESPACE}/${IMAGE_NAME}:${TAG}
          docker push ccr.ccs.tencentyun.com/${NAMESPACE}/${IMAGE_NAME}:${TAG}
